<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اطلاعات تماس</title>
</head>

<body>

<h2>اطلاعات تماس</h2>

<p>کارت اول:</p>
<p id="card1">6104339912345678</p>
<button onclick="copyCard('card1','result1')">کپی شماره کارت</button>
<p id="result1"></p>

<p>کارت دوم:</p>
<p id="card2">6037991234567890</p>
<button onclick="copyCard('card2','result2')">کپی شماره کارت</button>
<p id="result2"></p>

<p>کارت سوم:</p>
<p id="card3">6274123456789012</p>
<button onclick="copyCard('card3','result3')">کپی شماره کارت</button>
<p id="result3"></p>

<p>
<a href="tel:09123456789">📞 تماس</a>
</p>

<p>
<a href="https://wa.me/989123456789">💬 واتساپ</a>
</p>

<p>
<a href="https://instagram.com/USERNAME">📷 اینستاگرام</a>
</p>

<script>
function copyCard(cardId, resultId) {
var number = document.getElementById(cardId).innerText;
navigator.clipboard.writeText(number);
document.getElementById(resultId).innerText = "شماره کارت کپی شد ✓";
}
</script>

</body>
</html>
